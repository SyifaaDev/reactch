<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suntik React</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap">
<style>
:root {
  --yellow: #FFE500;
  --yellow-deep: #FFC800;
  --black: #111111;
  --white: #FFFFFF;
  --muted: #5a5a4a;
  --danger: #E5251B;
  --font-display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "Space Mono", ui-monospace, "Courier New", monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
[hidden] { display: none !important; }
body {
  background: var(--yellow);
  color: var(--black);
  font-family: var(--font-display);
  font-size: 16px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px;
  min-height: 100vh;
  background-image: radial-gradient(var(--black) 1.2px, transparent 1.2px);
  background-size: 22px 22px;
}
.wrap { max-width: 520px; margin: 0 auto; }
.card {
  background: var(--white);
  border: 4px solid var(--black);
  box-shadow: 10px 10px 0 var(--black);
  padding: 28px 24px 26px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.tag {
  align-self: flex-start;
  background: var(--black);
  color: var(--yellow);
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 12px;
  letter-spacing: .08em;
  text-transform: uppercase;
  padding: 4px 10px;
  transform: rotate(-2deg);
}
h1 {
  margin: 0;
  font-size: clamp(30px, 9vw, 44px);
  line-height: 1;
  font-weight: 700;
  letter-spacing: -.03em;
  text-transform: uppercase;
}
h1 span { background: var(--yellow); box-shadow: 0 0 0 3px var(--yellow); }
.desc { margin: 0; font-weight: 500; }
.desc.small {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--muted);
  border-left: 6px solid var(--black);
  padding-left: 10px;
}
form { display: flex; flex-direction: column; gap: 16px; margin: 0; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
label {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: .06em;
}
input {
  font: inherit;
  font-weight: 500;
  width: 100%;
  min-width: 0;
  background: var(--white);
  color: var(--black);
  border: 3px solid var(--black);
  border-radius: 0;
  padding: 12px;
  box-shadow: 4px 4px 0 var(--black);
  transition: transform .08s, box-shadow .08s, background .08s;
}
input::placeholder { color: #8d8d80; }
input:focus-visible {
  outline: none;
  background: var(--yellow);
  transform: translate(2px, 2px);
  box-shadow: 2px 2px 0 var(--black);
}
input.bad { border-color: var(--danger); box-shadow: 4px 4px 0 var(--danger); }
.err { color: var(--danger); font-family: var(--font-mono); font-size: 12px; font-weight: 700; }
.err:empty { display: none; }
#emoji { font-size: 22px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font-size: 20px;
  line-height: 1;
  background: var(--white);
  border: 3px solid var(--black);
  padding: 6px 9px;
  cursor: pointer;
  box-shadow: 3px 3px 0 var(--black);
  transition: transform .08s, box-shadow .08s;
}
.chip:hover { background: var(--yellow); }
.chip:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--black); }
.chip:focus-visible, .btn:focus-visible { outline: 3px solid var(--black); outline-offset: 3px; }
.btn {
  font: inherit;
  font-weight: 700;
  font-size: 18px;
  text-transform: uppercase;
  letter-spacing: .02em;
  background: var(--yellow);
  color: var(--black);
  border: 4px solid var(--black);
  padding: 15px 16px;
  cursor: pointer;
  box-shadow: 6px 6px 0 var(--black);
  transition: transform .08s, box-shadow .08s, background .08s;
}
.btn:hover { background: var(--yellow-deep); }
.btn:active { transform: translate(6px, 6px); box-shadow: 0 0 0 var(--black); }
.btn.ghost { background: var(--white); font-size: 14px; padding: 10px 14px; box-shadow: 4px 4px 0 var(--black); }
.btn.ghost:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--black); }

.overlay {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(17, 17, 17, .78);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal {
  width: 100%;
  max-width: 480px;
  background: var(--white);
  border: 4px solid var(--black);
  box-shadow: 10px 10px 0 var(--yellow);
  padding: 22px 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.modal h2 { margin: 0; font-size: 22px; text-transform: uppercase; letter-spacing: -.02em; }
.modal p { margin: 0; font-family: var(--font-mono); font-size: 13px; }
.summary { background: var(--yellow); border: 3px solid var(--black); padding: 8px 10px; word-break: break-all; }
.track { position: relative; height: 64px; border-bottom: 4px solid var(--black); overflow: hidden; }
.mouse { position: absolute; bottom: -2px; left: 0; width: 76px; height: 56px; transform: translateX(-4px); }
.mouse svg { width: 100%; height: 100%; overflow: visible; }
.mouse .body-bob { animation: bob .28s ease-in-out infinite; transform-origin: 50% 100%; }
.mouse .leg { transform-box: fill-box; transform-origin: 50% 0; }
.mouse .leg.a { animation: step .28s ease-in-out infinite; }
.mouse .leg.b { animation: step .28s ease-in-out infinite reverse; }
.mouse .tail { transform-box: fill-box; transform-origin: 100% 50%; animation: wag .4s ease-in-out infinite alternate; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
@keyframes step { 0%, 100% { transform: rotate(32deg); } 50% { transform: rotate(-32deg); } }
@keyframes wag { from { transform: rotate(-12deg); } to { transform: rotate(14deg); } }
.bar { height: 34px; border: 4px solid var(--black); background: var(--white); box-shadow: 4px 4px 0 var(--black); }
.fill {
  height: 100%;
  width: 0%;
  background: repeating-linear-gradient(-45deg, var(--yellow) 0 12px, var(--yellow-deep) 12px 24px);
  border-right: 4px solid var(--black);
}
.bar.done .fill { border-right: 0; background: var(--yellow); }
.meta { display: flex; justify-content: space-between; gap: 10px; font-family: var(--font-mono); font-weight: 700; font-size: 13px; }
.status { min-height: 2.6em; }
.modal-actions { display: flex; justify-content: flex-end; }
@media (max-width: 420px) {
  .card { padding: 22px 16px; box-shadow: 7px 7px 0 var(--black); }
}
@media (prefers-reduced-motion: reduce) {
  .mouse .body-bob, .mouse .leg, .mouse .tail { animation: none; }
  input, .btn, .chip { transition: none; }
}
</style>
</head>
<body>

<div class="wrap">
  <main class="card">
    <span class="tag">Tool react</span>
    <h1><span>Suntik</span> React</h1>
    <p class="desc">Tempel link postingan, pilih emoji, tentukan jumlahnya, lalu tekan tombol di bawah.</p>
    <p class="desc small">Proses berjalan sekitar 1 menit. Biarkan halaman ini tetap terbuka sampai selesai.</p>

    <form id="form" novalidate>
      <div class="field">
        <label for="url">URL postingan</label>
        <input id="url" name="url" type="url" inputmode="url" autocomplete="off" placeholder="https://whatsapp.com/channel/...">
        <div class="err" id="err-url" role="alert"></div>
      </div>

      <div class="field">
        <label for="emoji">Emoji react</label>
        <input id="emoji" name="emoji" type="text" autocomplete="off" maxlength="8" placeholder="👍">
        <div class="chips" aria-label="Pilihan cepat emoji">
          <button type="button" class="chip" data-emoji="👍" aria-label="Pilih 👍">👍</button>
          <button type="button" class="chip" data-emoji="❤️" aria-label="Pilih ❤️">❤️</button>
          <button type="button" class="chip" data-emoji="😂" aria-label="Pilih 😂">😂</button>
          <button type="button" class="chip" data-emoji="🔥" aria-label="Pilih 🔥">🔥</button>
          <button type="button" class="chip" data-emoji="😮" aria-label="Pilih 😮">😮</button>
          <button type="button" class="chip" data-emoji="🙏" aria-label="Pilih 🙏">🙏</button>
        </div>
        <div class="err" id="err-emoji" role="alert"></div>
      </div>

      <div class="field">
        <label for="count">Jumlah react</label>
        <input id="count" name="count" type="number" inputmode="numeric" min="1" max="1000" step="1" value="100" placeholder="100">
        <div class="err" id="err-count" role="alert"></div>
      </div>

      <button class="btn" id="go" type="submit">Suntik React Sekarang</button>
    </form>
  </main>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <h2 id="m-title">Sedang diproses...</h2>
    <p class="summary" id="summary"></p>

    <div class="track" aria-hidden="true">
      <div class="mouse" id="mouse">
        <svg viewBox="0 0 76 56" xmlns="http://www.w3.org/2000/svg">
          <g class="body-bob">
            <path class="tail" d="M10 36 C-6 36 -8 18 4 14" fill="none" stroke="#111111" stroke-width="4" stroke-linecap="round"/>
            <g class="leg a"><rect x="22" y="40" width="6" height="14" fill="#111111"/></g>
            <g class="leg b"><rect x="30" y="40" width="6" height="14" fill="#111111"/></g>
            <ellipse cx="36" cy="32" rx="24" ry="14" fill="#FFFFFF" stroke="#111111" stroke-width="4"/>
            <g class="leg b"><rect x="46" y="40" width="6" height="14" fill="#111111"/></g>
            <g class="leg a"><rect x="54" y="40" width="6" height="14" fill="#111111"/></g>
            <path d="M52 24 L72 32 L52 40 Z" fill="#FFE500" stroke="#111111" stroke-width="4" stroke-linejoin="round"/>
            <circle cx="73" cy="32" r="4" fill="#111111"/>
            <circle cx="50" cy="16" r="9" fill="#FFE500" stroke="#111111" stroke-width="4"/>
            <circle cx="58" cy="27" r="3" fill="#111111"/>
          </g>
        </svg>
      </div>
    </div>

    <div class="bar" id="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Progres">
      <div class="fill" id="fill"></div>
    </div>
    <div class="meta"><span id="pct">0%</span><span id="eta">sisa 60 dtk</span></div>
    <p class="status" id="status" aria-live="polite">Menyiapkan permintaan...</p>
    <div class="modal-actions"><button type="button" class="btn ghost" id="cancel">Batalkan</button></div>
  </div>
</div>

<script>
(function () {
  var DURATION = 60000;
  var STAGES = [
    [0, "Menyiapkan permintaan..."],
    [15, "Memeriksa link postingan..."],
    [35, "Mengirim react ke antrean..."],
    [65, "Menunggu respons server..."],
    [90, "Hampir selesai..."]
  ];

  var form = document.getElementById("form");
  var urlEl = document.getElementById("url");
  var emojiEl = document.getElementById("emoji");
  var countEl = document.getElementById("count");
  var overlay = document.getElementById("overlay");
  var fill = document.getElementById("fill");
  var bar = document.getElementById("bar");
  var pct = document.getElementById("pct");
  var eta = document.getElementById("eta");
  var statusEl = document.getElementById("status");
  var mouse = document.getElementById("mouse");
  var summary = document.getElementById("summary");
  var title = document.getElementById("m-title");
  var cancel = document.getElementById("cancel");
  var go = document.getElementById("go");
  var raf = 0, start = 0, running = false;

  function setErr(input, id, msg) {
    document.getElementById(id).textContent = msg || "";
    input.classList.toggle("bad", !!msg);
  }

  Array.prototype.forEach.call(document.querySelectorAll(".chip"), function (c) {
    c.addEventListener("click", function () {
      emojiEl.value = c.getAttribute("data-emoji");
      setErr(emojiEl, "err-emoji", "");
      emojiEl.focus();
    });
  });
  [[urlEl, "err-url"], [emojiEl, "err-emoji"], [countEl, "err-count"]].forEach(function (p) {
    p[0].addEventListener("input", function () { setErr(p[0], p[1], ""); });
  });

  function validate() {
    var ok = true;
    var valid = false;
    try { valid = /^https?:$/.test(new URL(urlEl.value.trim()).protocol); } catch (e) {}
    if (!valid) { setErr(urlEl, "err-url", "Masukkan link lengkap yang diawali https://"); ok = false; } else setErr(urlEl, "err-url", "");
    if (!emojiEl.value.trim()) { setErr(emojiEl, "err-emoji", "Isi satu emoji, atau pilih dari daftar."); ok = false; } else setErr(emojiEl, "err-emoji", "");
    var n = parseInt(countEl.value, 10);
    if (!(n >= 1 && n <= 1000)) { setErr(countEl, "err-count", "Jumlah harus antara 1 dan 1000."); ok = false; } else setErr(countEl, "err-count", "");
    return ok;
  }

  function stageText(p) {
    var t = STAGES[0][1];
    for (var i = 0; i < STAGES.length; i++) if (p >= STAGES[i][0]) t = STAGES[i][1];
    return t;
  }

  function render(p, elapsed) {
    var r = Math.min(100, p);
    fill.style.width = r + "%";
    pct.textContent = Math.floor(r) + "%";
    bar.setAttribute("aria-valuenow", String(Math.floor(r)));
    eta.textContent = "sisa " + Math.max(0, Math.ceil((DURATION - elapsed) / 1000)) + " dtk";
    var track = mouse.parentNode.clientWidth - mouse.clientWidth;
    mouse.style.left = (track * r / 100) + "px";
    statusEl.textContent = stageText(r);
  }

  function setAnim(state) {
    Array.prototype.forEach.call(mouse.querySelectorAll(".body-bob, .leg, .tail"), function (el) {
      el.style.animationPlayState = state;
    });
  }

  function tick(now) {
    if (!running) return;
    var elapsed = now - start;
    render((elapsed / DURATION) * 100, elapsed);
    if (elapsed >= DURATION) { finish(); return; }
    raf = requestAnimationFrame(tick);
  }

  function finish() {
    running = false;
    render(100, DURATION);
    bar.classList.add("done");
    title.textContent = "Proses selesai";
    statusEl.textContent = "Permintaan sudah selesai diproses.";
    cancel.textContent = "Tutup";
    setAnim("paused");
  }

  function close() {
    running = false;
    cancelAnimationFrame(raf);
    overlay.hidden = true;
    go.focus();
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (!validate()) return;
    // TODO: panggil API backend kamu di sini sebelum animasi dimulai.
    summary.textContent = emojiEl.value.trim() + "  x" + parseInt(countEl.value, 10) + "  →  " + urlEl.value.trim();
    title.textContent = "Sedang diproses...";
    cancel.textContent = "Batalkan";
    bar.classList.remove("done");
    setAnim("");
    overlay.hidden = false;
    render(0, 0);
    running = true;
    start = performance.now();
    raf = requestAnimationFrame(tick);
    cancel.focus();
  });

  cancel.addEventListener("click", close);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !overlay.hidden) close(); });
  window.addEventListener("resize", function () {
    if (running) { var el = performance.now() - start; render((el / DURATION) * 100, el); }
  });
})();
</script>
</body>
</html>
